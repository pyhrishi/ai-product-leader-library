<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Library">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22 role=%22img%22 aria-label=%22AI Product Leader Library%22%3E %3Cdefs%3E%3CclipPath id=%22lgc%22%3E%3Ccircle cx=%2224%22 cy=%2232%22 r=%2216%22/%3E%3C/clipPath%3E%3C/defs%3E %3Crect width=%2264%22 height=%2264%22 rx=%2215%22 fill=%22%230a0f15%22/%3E %3Ccircle cx=%2224%22 cy=%2232%22 r=%2216%22 fill=%22%233fd9c9%22/%3E %3Ccircle cx=%2240%22 cy=%2232%22 r=%2216%22 fill=%22%239a8cff%22/%3E %3Ccircle cx=%2240%22 cy=%2232%22 r=%2216%22 fill=%22%23ffb45e%22 clip-path=%22url%28%23lgc%29%22/%3E%3C/svg%3E">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>The AI Product Leader Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout idea: a night-library. Dark observatory canvas, each volume lit by its own colour. A cover with progress, then one page at a time. */
:root{
  --bg:#f2f4f8; --panel:#ffffff; --panel2:#f7f9fc; --ink:#111a24; --muted:#47546a; --line:#dce2ea;
  --accA:#05665f; --accB:#4a3bc2; --accC:#8f4204; --on:#ffffff; --accS:#3a4c60; --ok:#11703c;
  --acc:var(--accS); --glow:rgba(40,80,140,.10);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --disp:"Instrument Serif",Georgia,serif; --serif:"Newsreader",Georgia,serif; --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0f15; --panel:#111922; --panel2:#0e151d; --ink:#e8eef5; --muted:#8e9db0; --line:#1d2935;
  --accA:#3fd9c9; --accB:#9a8cff; --accC:#ffb45e; --accS:#a9bbcf; --ok:#4fd18b; --on:#0a0f15; --glow:rgba(120,140,255,.10); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f15; --panel:#111922; --panel2:#0e151d; --ink:#e8eef5; --muted:#8e9db0; --line:#1d2935;
  --accA:#3fd9c9; --accB:#9a8cff; --accC:#ffb45e; --accS:#a9bbcf; --ok:#4fd18b; --on:#0a0f15; --glow:rgba(120,140,255,.10); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.62;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%;transition:grid-template-columns .25s}
body.focus #app{grid-template-columns:0 minmax(0,1fr)}
body.focus #rail{display:none}
#rail{background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#railhead{padding:16px 14px 12px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;text-align:left;padding:0}
.logo{width:34px;height:34px;display:block;border-radius:9px;flex:none}.logobox{display:block;line-height:0}
.brand b{font:400 20px/1.05 var(--disp);letter-spacing:.01em}
.brand small{display:block;font:400 12px var(--sans);color:var(--muted);margin-top:2px}
#sbtn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--muted);cursor:pointer;font:400 14px var(--sans)}
#sbtn kbd{margin-left:auto;font:500 12px var(--sans);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
#sbtn:hover{border-color:var(--acc)}
#toc{overflow-y:auto;flex:1;padding:2px 8px 40px;font-family:var(--sans);font-size:14px}
.vol{margin-top:8px}
.volh{width:100%;text-align:left;border:0;background:none;padding:9px 8px;display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:600;border-radius:9px}
.volh:hover,.parth:hover,.pg:hover,.homeb:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.volh .dot{width:9px;height:9px;border-radius:50%;background:var(--vc);box-shadow:0 0 12px var(--vc)}
.meta{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px;font-variant-numeric:tabular-nums}
.parth{width:100%;text-align:left;border:0;background:none;padding:6px 8px 6px 12px;display:flex;gap:8px;cursor:pointer;border-radius:8px;line-height:1.35;color:var(--ink)}
.parth .pn{color:var(--vc);font-weight:600;min-width:20px;font-variant-numeric:tabular-nums}
.pgs{padding-left:14px;border-left:1px solid var(--line);margin:2px 0 6px 22px}
.pg{display:block;width:100%;text-align:left;border:0;background:none;padding:4px 8px;cursor:pointer;border-radius:6px;line-height:1.35;color:var(--muted);font-size:13px}
.pg.on,.parth.on,.homeb.on,.volh.on{background:color-mix(in srgb,var(--vc,var(--acc)) 16%,transparent);color:var(--ink);font-weight:600}
.pg.done::after{content:" ✓";color:var(--ok)}
.homeb{width:100%;text-align:left;border:0;background:none;padding:9px 8px;cursor:pointer;border-radius:9px;font-weight:600;display:flex;gap:10px;align-items:center;color:var(--ink)}
#main{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
#top{display:flex;align-items:center;gap:8px;padding:10px 18px;font-family:var(--sans);font-size:13px;color:var(--muted)}
#top .crumb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 12px;cursor:pointer;font-family:var(--sans);font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
#menu{display:none}
#rp{position:absolute;left:0;top:0;height:2px;width:0;background:var(--acc);z-index:5}
#scroll{flex:1;overflow-y:auto;min-height:0;background:radial-gradient(900px 420px at 85% -80px,var(--glow),transparent 70%)}
#page{max-width:880px;margin:0 auto;padding:20px 24px 40px}
.eyebrow{font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--acc);border-radius:2px}
h1.pt{font:400 clamp(34px,5vw,54px)/1.05 var(--disp);margin:10px 0 14px;text-wrap:balance;letter-spacing:-.005em}
h2.sec{font:600 13px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:38px 0 12px}
p{margin:0 0 14px;max-width:66ch}
code{font-family:ui-monospace,Menlo,monospace;font-size:.84em;background:color-mix(in srgb,var(--ink) 9%,transparent);padding:1px 5px;border-radius:5px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:30px;align-items:center;padding:26px 0 8px}
.hero h1{font:400 clamp(38px,5.6vw,64px)/1 var(--disp);margin:12px 0 14px;letter-spacing:-.01em}
.hero h1 em{font-style:italic;background:linear-gradient(100deg,var(--accA),var(--accB) 55%,var(--accC));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font-size:19px;color:var(--muted);max-width:44ch;margin-bottom:20px}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap}
.ringbig{position:relative;width:190px;height:190px}
.ringbig .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--sans)}
.ringbig b{font:400 44px/1 var(--disp)}
.ringbig span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:22px 0 6px}
.stat{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;font-family:var(--sans)}
.stat b{display:block;font:400 32px/1.1 var(--disp);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.vcard{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:8px;font-family:var(--sans);transition:transform .15s,border-color .15s}
.vcard::before{content:"";position:absolute;inset:-40% -30% auto auto;width:200px;height:200px;background:radial-gradient(circle,var(--vc),transparent 65%);opacity:.18}
.vcard:hover{transform:translateY(-2px);border-color:var(--vc)}
.vcard .vl{font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--vc)}
.vcard .vt{font:400 28px/1.05 var(--disp);color:var(--ink)}
.vcard .vd{font-size:13.5px;color:var(--muted);line-height:1.45;flex:1}
.vcard .vf{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted)}
.cont{display:flex;gap:16px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--vc);background:var(--panel);border-radius:14px;padding:14px 16px;cursor:pointer;width:100%;text-align:left;font-family:var(--sans);margin-top:4px}
.cont:hover{border-color:var(--vc)}
.cont .l{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cont .t{font:400 22px/1.2 var(--disp);color:var(--ink)}
.cont .go{margin-left:auto;font-size:20px;color:var(--vc)}
/* part hero */
.phero{position:relative;border:1px solid var(--line);border-radius:22px;padding:26px 26px 22px;overflow:hidden;background:var(--panel);margin-bottom:6px}
.phero::before{content:"";position:absolute;inset:0;background:radial-gradient(520px 260px at 100% 0,color-mix(in srgb,var(--acc) 26%,transparent),transparent 70%)}
.phero .big{position:absolute;right:18px;top:-18px;font:400 190px/1 var(--disp);color:var(--acc);opacity:.16;pointer-events:none}
.phero>*{position:relative}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-family:var(--sans)}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--sans);padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:color-mix(in srgb,var(--ink) 4%,transparent);color:var(--muted)}
.pill.ac{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mcard{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:16px;cursor:pointer;font-family:var(--sans);transition:transform .15s,border-color .15s}
.mcard:hover{transform:translateY(-2px);border-color:var(--acc)}
.mcard .mn{font:600 12px var(--sans);color:var(--acc);letter-spacing:.08em}
.mcard .mt{font:400 21px/1.15 var(--disp);color:var(--ink)}
.mcard .mf{display:flex;align-items:center;gap:10px;margin-top:auto;font-size:12px;color:var(--muted)}
.bar{flex:1;height:5px;background:color-mix(in srgb,var(--ink) 10%,transparent);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .3s}
/* module header + callouts */
.mhead .pillrow{margin-bottom:4px}
.aims{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.aim{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--panel);font-size:16px;line-height:1.5}
.aim .k{font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;color:var(--acc)}
.aim.pv .k{color:var(--ok)}
.tools{position:sticky;top:0;z-index:4;display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px -8px 14px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--panel) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-family:var(--sans);font-size:13.5px}
.tools .bar{min-width:120px}
.tools select{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:5px 8px;font-size:13px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tc{border:1px solid var(--line);background:var(--panel);border-radius:14px;transition:border-color .15s,background .15s}
.tc:hover{border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
.tc label{display:flex;gap:14px;padding:14px 16px;cursor:pointer}
.tc.dn{background:color-mix(in srgb,var(--ok) 7%,var(--panel));border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.cb{appearance:none;-webkit-appearance:none;width:24px;height:24px;flex:none;border:2px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:8px;margin:1px 0 0;cursor:pointer;background:transparent;display:grid;place-content:center;transition:all .15s}
.cb:hover{border-color:var(--ok)}
.cb:checked{background:var(--ok);border-color:var(--ok)}
.cb:checked::after{content:"";width:6px;height:11px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.bd{min-width:0;flex:1}
.th{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.id{font:600 12px var(--sans);color:var(--acc);font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--acc) 12%,transparent);padding:2px 7px;border-radius:6px}
.tt{font:400 22px/1.2 var(--disp)}
.tc.dn .tt{opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:400 13px/1.35 var(--sans);padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--ink) 6%,transparent);border:1px solid var(--line);color:color-mix(in srgb,var(--ink) 88%,transparent)}
.tx{display:block;margin-top:6px;font-size:16px;color:color-mix(in srgb,var(--ink) 85%,transparent)}
.plain{display:block;padding:4px 0 4px 18px;position:relative;max-width:66ch}
.plain::before{content:"";position:absolute;left:3px;top:.85em;width:6px;height:6px;border-radius:2px;background:var(--acc)}
.plain.d1{margin-left:26px}.plain.d2{margin-left:50px}
.ol1{display:flex;gap:12px;padding:8px 0;max-width:66ch;align-items:baseline}
.ol1 b.n{font:400 24px/1 var(--disp);color:var(--acc);min-width:24px}
.src{margin-top:18px;border-top:1px dashed var(--line);padding-top:12px;color:var(--muted);font-size:15.5px;font-style:italic}
.tw{overflow-x:auto;margin:12px 0 20px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:14px}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:color-mix(in srgb,var(--ink) 5%,transparent);font-weight:600;white-space:nowrap;font-size:12.5px;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
textarea.notes{width:100%;min-height:120px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);line-height:1.5;resize:vertical;font-size:16px}
.nav{display:flex;justify-content:space-between;gap:12px;margin:34px 0 10px;font-family:var(--sans)}
.nav .btn{flex:1;max-width:49%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:12px 14px;border-radius:12px}
.nav .btn small{display:block;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav .btn.nx{text-align:right;margin-left:auto}
/* search overlay */
#ov{position:fixed;inset:0;background:rgba(3,8,14,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;padding:9vh 16px 16px;z-index:30}
#ov.on{display:flex}
#ov .box{width:100%;max-width:680px;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45);display:flex;flex-direction:column;max-height:76vh}
#oq{border:0;border-bottom:1px solid var(--line);background:transparent;padding:18px 20px;font:400 18px var(--sans);outline:none;width:100%}
#ol{overflow-y:auto;padding:6px}
.res{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;border-radius:10px;cursor:pointer;font-family:var(--sans)}
.res.sel,.res:hover{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.res .rt{font-weight:600;font-size:14.5px}.res .rp{font-size:12px;color:var(--muted)}.res .rs{font-size:13px;margin-top:2px;color:color-mix(in srgb,var(--ink) 80%,transparent)}
.hint{padding:14px 18px;color:var(--muted);font:13px var(--sans)}
mark{background:color-mix(in srgb,#ffd24d 55%,transparent);color:inherit;border-radius:3px;padding:0 1px}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
#dlg.on{display:flex}
#dlg .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:560px;width:100%;font-family:var(--sans);display:flex;flex-direction:column;gap:10px}
#dlg textarea{min-height:160px;font:12px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel2);width:100%}
#sync{font:400 12px var(--sans);color:var(--muted)}

.hero2{padding:22px 0 18px}
.hero2 h1{font:400 clamp(40px,6.4vw,74px)/1 var(--disp);margin:12px 0 12px;letter-spacing:-.01em}
.hero2 h1 em{font-style:italic;background:linear-gradient(100deg,var(--accA),var(--accB) 60%,var(--accC));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero2 .sub{font-size:19px;color:var(--muted);max-width:52ch;margin:0}
.portals{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
.portal{position:relative;overflow:hidden;border-radius:24px;padding:26px;min-height:380px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);cursor:pointer;text-align:left;background:var(--panel);transition:transform .18s,border-color .18s;color:var(--ink)}
.portal::before{content:"";position:absolute;inset:-30% -20% auto auto;width:360px;height:360px;background:radial-gradient(circle,var(--vc),transparent 65%);opacity:.22;pointer-events:none}
.portal:hover{transform:translateY(-3px);border-color:var(--vc)}
.portal>*{position:relative}
.portal .vl{font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--vc)}
.portal .pt2{font:400 clamp(34px,4.2vw,50px)/1 var(--disp)}
.portal.cc .pt2{font:500 clamp(26px,3.2vw,38px)/1.1 var(--mono);letter-spacing:-.02em}
.portal .ptag{font-size:16.5px;color:var(--muted);line-height:1.5}
.pl{margin:0;padding:0;list-style:none;font:14px/1.4 var(--sans);display:flex;flex-direction:column;gap:7px;flex:1}
.pl li{padding-left:22px;position:relative}
.pl li::before{content:"✦";position:absolute;left:0;color:var(--vc)}
.pf{display:flex;align-items:center;gap:12px;margin-top:auto;font:13px var(--sans);color:var(--muted)}
.pf .enter{margin-left:auto;font-weight:600;color:var(--vc);font-size:14px}
.term{border:1px solid var(--line);background:#070b10;border-radius:12px;overflow:hidden;margin-top:16px;max-width:560px}
.term.sm{margin-top:4px;flex:1}
.tbar{display:flex;gap:6px;align-items:center;padding:9px 12px;border-bottom:1px solid #1b2733;font:12px var(--mono);color:#6d7f92}
.tbar i{width:9px;height:9px;border-radius:50%;background:#2a3846;display:block}
.tbar span{margin-left:8px}
.term pre{margin:0;padding:14px 16px;font:13px/1.65 var(--mono);color:#cfd9e4;white-space:pre-wrap}
.term .pr{color:#9a8cff}.term .ok2{color:#4fd18b}

<script>
"use strict";
var D=null, PAGES=[], PIDX={}, PART={}, VOL={}, S={d:{},l:{},n:{},last:"home"};
var VC={s:"--accS",a:"--accA",b:"--accB",c:"--accC"};
var VDESC={
  s:"Orientation, the bridge between volumes, three study tracks and a freshness protocol.",
  a:"Science, engineering, product craft, safety, industry, leadership and the frontier of AI.",
  b:"The agentic loop to hooks, subagents, the Agent SDK, security and PM workflows.",
  c:"Judgment, evals, AI economics, go-to-market, agents in production and public proof of work."
};
var VFIRST={s:"s-1",a:"a-0",b:"b-0",c:"c-1"};
var $=function(s){return document.querySelector(s)};
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function inl(t){
  var s=esc(t);
  s=s.replace(/\[([^\]]+)\]\(#([a-z0-9-]+)\)/g,'<a href="#$2">$1</a>');
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  s=s.replace(/(^|[^*\w])\*([^*]+)\*(?!\w)/g,"$1<i>$2</i>");
  return s;
}
function plain(t){return String(t).replace(/\[([^\]]+)\]\(#[a-z0-9-]+\)/g,"$1").replace(/[*`]/g,"")}
function ring(p,size,sw,col){
  var r=(size-sw)/2,c=2*Math.PI*r;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+" "+size+'" aria-hidden="true"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="currentColor" stroke-opacity=".12" stroke-width="'+sw+'"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+(c*p/100).toFixed(1)+" "+c.toFixed(1)+'" transform="rotate(-90 '+size/2+" "+size/2+')"/></svg>';
}

/* ---------- state ---------- */
var db=null, dbDoc=null, dbTimer=null, dbBusy=false, dbDirty=false;
function loadLocal(){try{var r=localStorage.getItem("aipl-v1");if(r)merge(JSON.parse(r))}catch(e){}}
function merge(o){if(!o)return;mergeX(o);if(o.days){S.days=S.days||{};Object.keys(o.days).forEach(function(k){S.days[k]=Math.max(S.days[k]||0,o.days[k])})}if(o.lastRead&&PIDX[o.lastRead]!==undefined)S.lastRead=o.lastRead;["d","l","n"].forEach(function(k){if(o[k])Object.keys(o[k]).forEach(function(x){S[k][x]=o[k][x]})});if(o.last&&(LAND[o.last]||TOOLS[o.last]||PIDX[o.last]!==undefined)&&!S.lastSet)S.last=o.last}
function saveLocal(){try{localStorage.setItem("aipl-v1",JSON.stringify(S))}catch(e){}}
function save(){saveLocal();dbDirty=true;clearTimeout(dbTimer);dbTimer=setTimeout(flushDb,1500);status()}
function status(t){$("#sync").textContent=t||(db?"Synced to your account":"Saved on this device")}
async function flushDb(){
  if(!dbDoc||dbBusy||!dbDirty)return;
  dbBusy=true;dbDirty=false;
  try{await dbDoc.set({state:JSON.stringify(S),at:Date.now()});status()}catch(e){status("Saved on this device")}
  dbBusy=false;if(dbDirty)flushDb();
}
async function initDb(){
  try{
    if(!window.claude||!claude.use)return;
    var user=await claude.use("user"),d=await claude.use("db");
    if(!d||!user)return;
    var id=await user.id();if(!id)return;
    dbDoc=d.collection("data/users/"+id).doc("library");
    var snap=await dbDoc.get();
    if(snap&&snap.exists){var v=snap.data();if(v&&v.state){try{merge(JSON.parse(v.state))}catch(e){}}}
    db=d;saveLocal();status();dbDirty=true;flushDb();render();
  }catch(e){db=null;dbDoc=null}
}

/* ---------- data ---------- */
function index(){
  D.vols.forEach(function(v){VOL[v.id]=v;v.parts.forEach(function(p){
    p.vol=v;PART[p.id]=p;
    var ov={id:p.id,title:p.title,blocks:p.over,part:p,over:true};
    p.overview=ov;PAGES.push(ov);
    p.pages.forEach(function(pg){pg.part=p;PAGES.push(pg)});
  })});
  PAGES.forEach(function(pg,i){PIDX[pg.id]=i;pg.text="";pg.keys=[];
    pg.blocks.forEach(function(b){
      if(b.t==="table")b.rows.forEach(function(r){pg.text+=" "+r.join(" ")});
      else if(b.t==="p"||b.t==="meta")pg.text+=" "+plain(b.x);
      else b.items.forEach(function(it){pg.text+=" "+(it.id?it.id+" "+it.title+" ":"")+plain(it.x);if(it.id)pg.keys.push(pg.part.vol.id+":"+it.id)});
    });
    pg.n=pg.keys.length;pg.low=(pg.title+" "+pg.text).toLowerCase();
  });
  D.vols.forEach(function(v){v.n=0;v.parts.forEach(function(p){p.n=0;[p.overview].concat(p.pages).forEach(function(g){p.n+=g.n});v.n+=p.n})});
  D.total=D.vols.reduce(function(a,v){return a+v.n},0);
}
function cnt(keys){var c=0;for(var i=0;i<keys.length;i++)if(S.d[keys[i]])c++;return c}
function partKeys(p){var k=[];[p.overview].concat(p.pages).forEach(function(g){k=k.concat(g.keys)});return k}
function volKeys(v){var k=[];v.parts.forEach(function(p){k=k.concat(partKeys(p))});return k}
function pct(a,b){return b?Math.round(100*a/b):0}
function nm(t){return t.replace(/^Module\s+/,"")}

/* ---------- toc ---------- */
var open={};
function curVolId(){var c=PAGES[PIDX[S.last]];return c?c.part.vol.id:(LAND[S.last]&&LAND[S.last]!==1?LAND[S.last]:null)}

function splitChips(t){
  if(/[.!?]\s+[A-Z]/.test(t))return null;
  var out=[],cur="",dep=0;
  for(var i=0;i<t.length;i++){var c=t[i];
    if(c==="("||c==="[")dep++;else if(c===")"||c==="]")dep=Math.max(0,dep-1);
    if(dep===0&&(c===","||c===";")){out.push(cur);cur=""}else cur+=c}
  out.push(cur);
  out=out.map(function(x){return x.trim().replace(/\.$/,"")}).filter(Boolean);
  return out.length>=2?out:null;
}
function metaSplit(pg){
  var m={dt:"",pv:"",src:[]},rest=[];
  pg.blocks.forEach(function(b){
    if(b.t==="meta"){
      var x=b.x.replace(/^\*+|\*+$/g,"");
      var pi=x.search(/Prove-it:/i);
      if(/^Depth target/i.test(x)&&pi>0){m.dt+=x.slice(0,pi).replace(/^Depth target:?\s*/i,"").trim();m.pv+=x.slice(pi).replace(/^Prove-it:?\s*/i,"")}
      else if(/^Depth target/i.test(x))m.dt+=(m.dt?" ":"")+x.replace(/^Depth target:?\s*/i,"");
      else if(/^Prove-it/i.test(x))m.pv+=(m.pv?" ":"")+x.replace(/^Prove-it:?\s*/i,"");
      else if(/^(Learn from|Read|Watch)/i.test(x))m.src.push(b.x);
      else rest.push(b);
    }else rest.push(b);
  });
  return {m:m,rest:rest};
}
function renderBlocks(blocks,v){
  var h="";
  blocks.forEach(function(b){
    if(b.t==="p")h+="<p>"+inl(b.x)+"</p>";
    else if(b.t==="meta")h+='<div class="src">'+inl(b.x)+"</div>";
    else if(b.t==="table"){
      h+='<div class="tw"><table><thead><tr>'+b.rows[0].map(function(c){return "<th>"+inl(c)+"</th>"}).join("")+"</tr></thead><tbody>";
      b.rows.slice(1).forEach(function(r){h+="<tr>"+r.map(function(c){return "<td>"+inl(c)+"</td>"}).join("")+"</tr>"});
      h+="</tbody></table></div>";

      h+=hasT?'<ul class="tl">':"<div>";
      b.items.forEach(function(it){

          var key=v.id+":"+it.id,dn=S.d[key],ch=splitChips(it.x);
          h+='<li class="tc'+(dn?" dn":"")+'"><label><input type="checkbox" class="cb" data-k="'+esc(key)+'" aria-label="Mark '+esc(it.id)+' '+esc(it.title)+' as done"'+(dn?" checked":"")+'><div class="bd"><div class="th"><span class="id">'+esc(it.id)+'</span><span class="tt">'+esc(it.title)+"</span></div>";
          if(it.x){h+=ch?'<div class="chips">'+ch.map(function(c){return '<span class="chip">'+inl(c)+"</span>"}).join("")+"</div>":'<span class="tx">'+inl(it.x)+"</span>"}

function doSearch(){
  var q=$("#oq").value.trim().toLowerCase(),box=$("#ol");
  results=[];sel=0;
  if(q.length<2){box.innerHTML='<div class="hint">Type two or more letters. Every word must match. Try “prompt injection”, “eval”, “hooks” or “unit economics”.</div>';return}
  var terms=q.split(/\s+/),rx=new RegExp("("+terms.map(function(x){return x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}).join("|")+")","gi");
  for(var i=0;i<PAGES.length;i++){
    var pg=PAGES[i],ok=true;
    for(var t=0;t<terms.length;t++)if(pg.low.indexOf(terms[t])<0){ok=false;break}
    if(!ok)continue;
    var pos=pg.low.indexOf(terms[0]),tx=pg.title+" "+pg.text,st=Math.max(0,pos-45);
    results.push({pg:pg,sn:(st>0?"…":"")+tx.slice(st,pos+120)+"…",r:pg.title.toLowerCase().indexOf(terms[0])>=0?0:1});
  }
  results.sort(function(a,b){return a.r-b.r});results=results.slice(0,40);
  var h=results.length?"":'<div class="hint">No page matches every word. Try fewer words.</div>';
  results.forEach(function(o,k){var pg=o.pg;h+='<button role="option" id="res-'+k+'" aria-selected="'+(k===0)+'" class="res'+(k===0?" sel":"")+'" data-i="'+k+'" style="--acc:var('+VC[pg.part.vol.id]+')"><div class="rt">'+esc(label(pg))+'</div><div class="rp">'+esc(pg.part.vol.title)+(pg.over?"":" › "+esc(pg.part.title))+'</div><div class="rs">'+esc(o.sn).replace(rx,"<mark>$1</mark>")+"</div></button>"});
  box.innerHTML=h;
}

function dnum(d){d=d||new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)}

function toks(t){return (String(t).toLowerCase().match(/[a-z][a-z0-9]{2,}/g)||[]).filter(function(w){return !STOP.test(w)}).map(function(w){return w.replace(/(ing|ed|es|s)$/,"")})}

  ["srs","proj"].forEach(function(k){if(!o[k])return;S[k]=S[k]||{};Object.keys(o[k]).forEach(function(x){if(!S[k][x]||(o[k][x].t||0)>(S[k][x].t||0))S[k][x]=o[k][x]})});

  if(o.quiz){S.quiz=S.quiz||[];o.quiz.forEach(function(q){if(!S.quiz.some(function(z){return z.t===q.t}))S.quiz.push(q)})}

function initTools(){
  PAGES.forEach(function(pg){pg.blocks.forEach(function(b){
    if(!b.items)return;var par="";
    b.items.forEach(function(it){
      if(it.id){TMAP[pg.part.vol.id+":"+it.id]={pg:pg,it:it};par=it.title}
      else if(it.d&&/^(a|b)-17-/.test(pg.id))QPOOL.push({q:it.x,cat:par||pg.title,vol:pg.part.vol.id,pg:pg.id});
    });
  })});
  S.srs=S.srs||{};
  Object.keys(S.d).forEach(function(k){if(S.d[k]&&!S.srs[k]&&TMAP[k])S.srs[k]={s:0,due:dnum(),t:Date.now()}});
  var mods=PAGES.filter(function(p){return !p.over&&p.n&&p.part.vol.id!=="s"&&!(p.part.vol.id!=="c"&&p.part.num>=14)}),tk=mods.map(function(p){var set={};toks(p.title+" "+p.blocks.map(function(b){return b.items?b.items.filter(function(i){return i.id}).map(function(i){return i.title}).join(" "):""}).join(" ")).forEach(function(w){set[w]=1});return set});
  mods.forEach(function(a,i){
    var sc=[];
    mods.forEach(function(b,j){
      if(a.part.vol.id===b.part.vol.id)return;
      var A=tk[i],B=tk[j],inter=0,na=0,nb=0,w;for(w in A)na++;for(w in B)nb++;for(w in A)if(B[w])inter++;
      var s=inter/Math.sqrt((na||1)*(nb||1));if(s>=.14&&inter>=2)sc.push([s,b.id]);
    });
    sc.sort(function(x,y){return y[0]-x[0]});REL[a.id]=sc.slice(0,3).map(function(x){return x[1]});
  });
}

function trapTab(e,box){
  var f=box.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])');f=Array.prototype.filter.call(f,function(x){return !x.disabled&&x.offsetParent!==null});
  if(!f.length)return;var first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
}
document.addEventListener("keydown",function(e){
  var dlg=$("#dlg").classList.contains("on"),ov=$("#ov").classList.contains("on"),rail=$("#rail").classList.contains("open");
  if(e.key==="Escape"){if(dlg){closeDlg();return}if(rail){setRail(false);return}}
  if(e.key==="Tab"){if(dlg)trapTab(e,$("#dlg .box"));else if(ov)trapTab(e,$("#ov .box"));else if(rail)trapTab(e,$("#rail"))}
  if((e.key==="Enter"||e.key===" ")&&e.target.getAttribute&&e.target.getAttribute("role")==="link"&&e.target.dataset.go){e.preventDefault();go(e.target.dataset.go)}
},true);
function bootExtras(){
  applyThemeMeta();

  var host=/github\.io$|^localhost$|^127\./.test(location.hostname),seen=false;
  try{seen=localStorage.getItem("aipl-ios")==="1"}catch(e){}
  if(ios&&host&&!isStandalone()&&!seen)setTimeout(function(){$("#ios").classList.add("on");setTimeout(function(){$("#ios").classList.remove("on")},14000)},3500);
  $("#iosx").onclick=function(){$("#ios").classList.remove("on");try{localStorage.setItem("aipl-ios","1")}catch(e){}};
}
